<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" fill="none">
  <defs>
    <linearGradient id="green" x1="0" y1="220" x2="0" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174D2D"/>
      <stop offset=".48" stop-color="#20713D"/>
      <stop offset="1" stop-color="#104326"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="220" x2="0" y2="650" gradientUnits="userSpaceOnUse">
