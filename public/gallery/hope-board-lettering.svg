    <path d="M729 495C692 456 658 427 625 407M453 578C488 618 519 645 557 667" stroke="#E7C677" stroke-width="2.5"/>
    <use href="#sprig" transform="translate(718 492) rotate(112) scale(.64)"/>
    <use href="#sprig" transform="translate(672 450) rotate(108) scale(.56)"/>
    <use href="#sprig" transform="translate(474 604) rotate(-55) scale(.67)"/>
    <use href="#sprig" transform="translate(525 645) rotate(-63) scale(.55)"/>
